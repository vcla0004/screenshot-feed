<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Add Photos</title>
<meta name="description" content="Pick screenshots and PDFs to add, shown in a clean vertical feed, sized for iPhone 17 Pro Max.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Add Photos">
<meta name="theme-color" content="#FFFFFF">

<style>
  :root{
    --bg: #FFFFFF;
    --ink: #111111;
    --ink-dim: #9A9A9A;
    --line: rgba(17,17,17,0.10);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin:0; padding:0; overflow-x:hidden; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    display:flex;
    justify-content:center;
    min-height: 100dvh;
  }

  .stage{
    width: 100%;
    min-height: 100dvh;
    background: var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media (min-width: 600px){
    .stage{ max-width: 430px; margin: 20px 0; min-height: calc(100dvh - 40px); border-radius: 46px; overflow:hidden; box-shadow: 0 24px 60px -30px rgba(0,0,0,0.35); }
  }

  /* ---------- page transition ---------- */
  /* Native cross-document transition: the browser snapshots the whole
     screen (header included) and slides it, so there is no blank gap. */
  @view-transition { navigation: auto; }

  /* Kill the default root morph + cross-fade. Without these the snapshot
     resizes between pages, which reads as an expand from a corner. */
  ::view-transition-group(root){ animation: none; }
  ::view-transition-image-pair(root){ isolation: auto; }

  /* Old page holds still underneath. */
  ::view-transition-old(root){
    animation: none;
    mix-blend-mode: normal;
  }

  /* New page slides in from the left, on top of the old one. */
  ::view-transition-new(root){
    animation: 420ms cubic-bezier(.32,.72,0,1) both page-enter-left;
    mix-blend-mode: normal;
    z-index: 1;
  }

  @keyframes page-enter-left{
    from{ transform: translateX(-100%); box-shadow: 0 0 40px rgba(0,0,0,0.28); }
    to{ transform: translateX(0); box-shadow: 0 0 0 rgba(0,0,0,0); }
  }

  /* fallback slide for browsers without view transitions */
  .stage.sliding{ will-change: transform; backface-visibility: hidden; }

  @media (prefers-reduced-motion: reduce){
    ::view-transition-old(root),
    ::view-transition-new(root){ animation: none; }
  }

  .reel{
    flex:1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 0;
    display:flex;
    flex-direction:column;
    gap: 0;
  }

  /* each photo fills the screen below the Dynamic Island */
  .frame{
    scroll-snap-align: start;
    flex: 0 0 calc(100dvh - env(safe-area-inset-top, 0px) - 8px);
    height: calc(100dvh - env(safe-area-inset-top, 0px) - 8px);
    overflow:hidden;
    background: var(--bg);
    opacity:0;
    animation: rise .45s cubic-bezier(.2,.7,.3,1) forwards;
    cursor: pointer;
  }
  .frame:active{ opacity: .82; }
  @media (prefers-reduced-motion: reduce){
    .frame{ animation: none; opacity:1; transform:none; }
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .frame img{
    width:100%; height:100%; object-fit: cover; display:block;
  }

  /* ---------- pdf card ---------- */
  .doc-card{
    display:flex; align-items:center; gap:12px;
    margin: 0 14px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    text-decoration:none;
    color: var(--ink);
    pointer-events: auto;
  }
  .doc-icon{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:9px;
    background: #F4F4F2;
    display:flex; align-items:center; justify-content:center;
  }
  .doc-icon svg{ width:18px; height:18px; color: var(--ink-dim); }
  .doc-text{ min-width:0; }
  .doc-name{
    font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .doc-meta{ font-size:12px; color: var(--ink-dim); margin-top:1px; }

  /* ---------- empty state ---------- */
  .empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px; padding: 40px 30px; text-align:center; color: var(--ink-dim);
  }
  .empty svg{ width:30px; height:30px; color: var(--ink-dim); }
  .empty-title{ font-size:15px; font-weight:600; color: var(--ink); }
  .empty-sub{ font-size: 13px; max-width: 220px; line-height:1.5; }
</style>
</head>
<body>

<div class="stage">
  <main class="reel" id="reel"></main>
  <input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden>
</div>

<script>
(function(){
  "use strict";

  var STATE_KEY = "upload";

  var reel = document.getElementById("reel");
  var fileInput = document.getElementById("fileInput");
  var stage = document.querySelector(".stage");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var state = { feed: [], stamp: null };
  var liveUrls = [];

  /* ---------------- storage ---------------- */

  var dbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open("feedSession", 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains("state")) db.createObjectStore("state");
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });

  function withStore(mode, fn){
    return dbPromise.then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction("state", mode);
        var out = fn(tx.objectStore("state"));
        tx.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){ return null; });
  }

  function saveState(){
    return withStore("readwrite", function(store){ store.put(state, STATE_KEY); });
  }
  function loadState(){
    return withStore("readonly", function(store){ return store.get(STATE_KEY); });
  }
  function clearState(){
    return withStore("readwrite", function(store){ store.delete(STATE_KEY); });
  }

  function isReload(){
    try{
      var nav = performance.getEntriesByType("navigation")[0];
      if(nav && nav.type) return nav.type === "reload";
    }catch(e){}
    return false;
  }

  /* ---------------- helpers ---------------- */

  function downscaleToBlob(file){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var MAXW = 1600;
        if(img.naturalWidth <= MAXW){
          URL.revokeObjectURL(url);
          resolve(file);
          return;
        }
        var scale = MAXW / img.naturalWidth;
        var canvas = document.createElement("canvas");
        canvas.width = MAXW;
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(b){ resolve(b || file); }, "image/webp", 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function toItem(file){
    if(file.type === "application/pdf"){
      return Promise.resolve({ blob: file, kind: "pdf", name: file.name, size: file.size });
    }
    return downscaleToBlob(file).then(function(blob){
      return { blob: blob, kind: "image", name: file.name, size: blob.size };
    });
  }

  function objectUrl(blob){
    var url = URL.createObjectURL(blob);
    liveUrls.push(url);
    return url;
  }

  function formatSize(bytes){
    if(bytes >= 1e6) return (bytes / 1e6).toFixed(1) + " MB";
    return Math.max(1, Math.round(bytes / 1e3)) + " KB";
  }

  function frameNode(item){
    var art = document.createElement("article");
    art.className = "frame";
    var img = new Image();
    img.decoding = "async";
    img.alt = "Screenshot";
    img.src = objectUrl(item.blob);
    art.appendChild(img);
    return art;
  }

  function pdfNode(item){
    var a = document.createElement("a");
    a.className = "doc-card";
    a.href = objectUrl(item.blob);
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<span class="doc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/></svg></span>' +
      '<span class="doc-text"><span class="doc-name"></span>' +
      '<span class="doc-meta">PDF · ' + formatSize(item.size) + '</span></span>';
    a.querySelector(".doc-name").textContent = item.name;
    return a;
  }

  function render(){
    liveUrls.forEach(function(u){ URL.revokeObjectURL(u); });
    liveUrls = [];
    reel.innerHTML = "";

    if(!state.feed.length){
      reel.innerHTML =
        '<div class="empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5.2-5.2a2 2 0 0 0-2.8 0L6 18"/></svg>' +
          '<div class="empty-title">Opening picker…</div>' +
          '<div class="empty-sub">If nothing opens, tap anywhere to choose screenshots or PDFs.</div>' +
        '</div>';
      return;
    }

    state.feed.forEach(function(item){
      reel.appendChild(item.kind === "pdf" ? pdfNode(item) : frameNode(item));
    });
  }

  function addFiles(fileList){
    var files = Array.prototype.slice.call(fileList).filter(function(f){
      return f.type.indexOf("image/") === 0 || f.type === "application/pdf";
    });
    if(!files.length) return;
    Promise.all(files.map(toItem)).then(function(items){
      state.feed = state.feed.concat(items);
      if(!state.stamp) state.stamp = Date.now();
      saveState();
      render();
    });
  }

  fileInput.addEventListener("change", function(){
    if(fileInput.files && fileInput.files.length) addFiles(fileInput.files);
    fileInput.value = "";
  });

  function openPicker(){
    if(state.feed.length) return;
    fileInput.click();
  }

  document.addEventListener("click", openPicker);

  /* ---------------- page transition ---------------- */

  var SLIDE_MS = 380;
  var SLIDE_EASE = "cubic-bezier(.32,.72,0,1)";

  // If the browser drives the transition natively, JS must not animate too.
  var nativeVT = typeof CSS !== "undefined" && CSS.supports &&
                 CSS.supports("view-transition-name", "none");

  // Fallback only: arriving page slides in from the left.
  if(sessionStorage.getItem("navSlide")){
    sessionStorage.removeItem("navSlide");
    if(!nativeVT && !reduceMotion && typeof stage.animate === "function"){
      stage.classList.add("sliding");
      var enter = stage.animate([
        { transform: "translateX(-100%)" },
        { transform: "translateX(0)" }
      ], { duration: SLIDE_MS, easing: SLIDE_EASE });
      enter.onfinish = function(){ stage.classList.remove("sliding"); };
    }
  }

  function slideNavigate(url){
    if(nativeVT || reduceMotion || typeof stage.animate !== "function"){
      window.location.href = url;
      return;
    }

    var navigated = false;
    function go(){
      if(navigated) return;
      navigated = true;
      window.location.href = url;
    }

    sessionStorage.setItem("navSlide", "1");

    stage.classList.add("sliding");
    var exit = stage.animate([
      { transform: "translateX(0)" },
      { transform: "translateX(100%)" }
    ], { duration: SLIDE_MS, easing: SLIDE_EASE, fill: "forwards" });

    exit.onfinish = go;
    setTimeout(go, SLIDE_MS + 160);
  }

  // Tapping any uploaded photo goes back to View details.
  reel.addEventListener("click", function(e){
    var frame = e.target.closest(".frame");
    if(!frame) return;
    e.stopPropagation();
    slideNavigate("index.html");
  });

  /* ---------------- boot ---------------- */

  if(isReload()){
    clearState().then(function(){ render(); openPicker(); });
  } else {
    loadState().then(function(saved){
      if(saved && saved.feed && saved.feed.length){
        state = saved;
        render();
      } else {
        render();
        openPicker();
      }
    });
  }
})();
</script>
</body>
</html>
