<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Screenshot Feed</title>
<meta name="description" content="A clean vertical scrolling feed of screenshots and PDFs you pick once per visit, sized for iPhone 17 Pro Max.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screenshots">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">

<style>
  :root{
    --bg: #FFFFFF;
    --ink: #111111;
    --ink-dim: #9A9A9A;
    --line: rgba(17,17,17,0.10);
    --tab-active: #3A4049;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin:0; padding:0; overflow-x:hidden; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    display:flex;
    justify-content:center;
    min-height: 100dvh;
  }

  .stage{
    width: 100%;
    min-height: 100dvh;
    background: var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media (min-width: 600px){
    .stage{ max-width: 430px; margin: 20px 0; min-height: calc(100dvh - 40px); border-radius: 46px; overflow:hidden; box-shadow: 0 24px 60px -30px rgba(0,0,0,0.35); }
    .topbar{ max-width: 430px; margin: 0 auto; }
  }

  /* ---------- page transition ---------- */
  /* Native cross-document transition: the browser snapshots the whole
     screen (header included) and slides it, so there is no blank gap. */
  @view-transition { navigation: auto; }

  /* Kill the default root morph + cross-fade. Without these the snapshot
     resizes between pages, which reads as an expand from a corner. */
  ::view-transition-group(root){ animation: none; }
  ::view-transition-image-pair(root){ isolation: auto; }

  /* Old page holds still underneath. */
  ::view-transition-old(root){
    animation: none;
    mix-blend-mode: normal;
  }

  /* New page slides in from the left, on top of the old one. */
  ::view-transition-new(root){
    animation: 420ms cubic-bezier(.32,.72,0,1) both page-enter-left;
    mix-blend-mode: normal;
    z-index: 1;
  }

  @keyframes page-enter-left{
    from{ transform: translateX(-100%); box-shadow: 0 0 40px rgba(0,0,0,0.28); }
    to{ transform: translateX(0); box-shadow: 0 0 0 rgba(0,0,0,0); }
  }

  /* fallback slide for browsers without view transitions */
  .stage.sliding{ will-change: transform; backface-visibility: hidden; }

  @media (prefers-reduced-motion: reduce){
    ::view-transition-old(root),
    ::view-transition-new(root){ animation: none; }
  }

  /* ---------- floating header ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0));
    backdrop-filter: blur(2.5px) saturate(160%);
    -webkit-backdrop-filter: blur(2.5px) saturate(160%);
    -webkit-mask-image: linear-gradient(180deg, #000 75%, transparent);
    mask-image: linear-gradient(180deg, #000 75%, transparent);
    pointer-events: none;
  }
  .topbar-back{
    position:absolute; left:16px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    width:40px; height:40px; border-radius:50%;
    background: linear-gradient(155deg, rgba(255,255,255,0.4), rgba(255,255,255,0.06) 60%, rgba(255,255,255,0.14));
    backdrop-filter: blur(2px) saturate(160%);
    -webkit-backdrop-filter: blur(2px) saturate(160%);
    color: var(--ink);
    box-shadow: 0 8px 18px -8px rgba(17,17,17,0.18), inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -6px 10px -8px rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; pointer-events:auto;
    border:none;
  }
  .topbar-back svg{ width:18px; height:18px; }
  .topbar-title{
    font-size:19px; font-weight:700; color: rgba(17,17,17,0.8);
  }

  .meta-row{
    padding: 14px 16px 0;
    margin-bottom: -4px;
    font-size: 12px; color: var(--ink-dim);
    text-align: center;
  }
  .meta-row strong{ color: rgba(17,17,17,0.75); font-weight:500; }

  .reel{
    flex:1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    scroll-behavior: smooth;
    scroll-snap-type: y proximity;
    padding: calc(env(safe-area-inset-top, 0px) + 62px) 0 0;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .frame{
    scroll-snap-align: start;
    overflow:hidden;
    background: var(--bg);
    opacity:0; transform: translateY(8px);
    animation: rise .45s cubic-bezier(.2,.7,.3,1) forwards;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce){
    .frame{ animation: none; opacity:1; transform:none; }
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .frame img{
    width:100%; height:100%; object-fit: cover; display:block;
  }

  /* ---------- pdf card ---------- */
  .doc-card{
    display:flex; align-items:center; gap:12px;
    margin: 0 14px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    text-decoration:none;
    color: var(--ink);
    pointer-events: auto;
  }
  .doc-icon{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:9px;
    background: #F4F4F2;
    display:flex; align-items:center; justify-content:center;
  }
  .doc-icon svg{ width:18px; height:18px; color: var(--ink-dim); }
  .doc-text{ min-width:0; }
  .doc-name{
    font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .doc-meta{ font-size:12px; color: var(--ink-dim); margin-top:1px; }

  /* ---------- tabs ---------- */
  .tabs-wrap{ display:flex; flex-direction:column; gap:10px; }
  .tab-bar{
    position:relative;
    display:flex; gap:0;
    margin: 16px 24px 2px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    touch-action: manipulation;
    overflow: hidden;
  }
  /* the morphing pill that slides between tabs */
  .tab-indicator{
    position:absolute; top:0; bottom:0; left:0;
    width:0;
    background: var(--tab-active);
    border-radius: 999px;
    z-index:0;
    will-change: transform, width;
  }
  .tab-btn{
    position:relative; z-index:1;
    flex:1; border:none; background:transparent; cursor:pointer;
    padding: 7px 4px; border-radius: 999px;
    font-family: inherit;
    font-size: 14px; font-weight:600; color: var(--ink-dim);
    text-align:center;
    transition: color .3s cubic-bezier(.32,.72,0,1);
    -webkit-user-select:none; user-select:none;
  }
  .tab-btn.active{ color: #fff; }
  .tab-btn.editing{ padding: 0 4px; }
  .tab-input{
    width:100%; min-width:0;
    border:none; background:transparent; outline:none;
    padding: 7px 0;
    font-family: inherit; font-size: 14px; font-weight:600;
    color: inherit; text-align:center;
    -webkit-user-select:text; user-select:text;
  }
  @media (prefers-reduced-motion: reduce){
    .tab-indicator{ transition:none; }
  }
  .tab-panel{ display:flex; flex-direction:column; gap:10px; }
  .slot{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    min-height: 130px; padding: 30px 20px; margin: 0 14px;
    border: 1px dashed var(--line); border-radius: 14px;
    color: var(--ink-dim); font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .slot svg{ width:24px; height:24px; }
  .slot.filled{
    display:block;
    min-height:0; padding:0; margin:0;
    border:none; border-radius:0;
    overflow:hidden;
  }
  .slot.filled img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .slot-replace{
    position:absolute; right:12px; bottom:12px;
    background: rgba(17,17,17,0.5); color:#fff;
    font-size:11.5px; font-weight:600;
    padding:6px 11px; border-radius:999px;
  }

  /* ---------- empty state ---------- */
  .empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px; padding: 40px 30px; text-align:center; color: var(--ink-dim);
  }
  .empty svg{ width:30px; height:30px; color: var(--ink-dim); }
  .empty-title{ font-size:15px; font-weight:600; color: var(--ink); }
  .empty-sub{ font-size: 13px; max-width: 220px; line-height:1.5; }
</style>
</head>
<body>

<div class="stage">
  <header class="topbar">
    <button class="topbar-back" id="backBtn" type="button" aria-label="Add photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l-8 8 8 8"/></svg>
    </button>
    <span class="topbar-title">View details</span>
  </header>
  <main class="reel" id="reel">
    <div class="empty" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5.2-5.2a2 2 0 0 0-2.8 0L6 18"/></svg>
      <div class="empty-title">Opening picker…</div>
      <div class="empty-sub">If nothing opens, tap anywhere to choose screenshots or PDFs.</div>
    </div>
  </main>
  <input type="file" id="fileInput" accept="image/*,application/pdf" hidden>
</div>

<script>
(function(){
  "use strict";

  var SLOT_COUNTS = [3, 1, 1];
  var TAB_LABELS = ["Tab 1", "Tab 2", "Tab 3"];
  var STATE_KEY = "index";

  var reel = document.getElementById("reel");
  var fileInput = document.getElementById("fileInput");
  var backBtn = document.getElementById("backBtn");
  var stage = document.querySelector(".stage");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // state.feed: [{blob, kind, name, size}]  state.tabs[i][slot]: item or null
  var state = {
    feed: [],
    tabs: SLOT_COUNTS.map(function(n){ return new Array(n).fill(null); }),
    labels: TAB_LABELS.slice(),
    stamp: null
  };
  var activeTab = 0;
  var panelEl = null;
  var indicatorEl = null;
  var indicatorPos = { left: 0, width: 0 };
  var tabBtnEls = [];

  // One stable object URL per blob, so re-rendering never re-fetches an image.
  var urlCache = new WeakMap();
  function objectUrl(blob){
    var url = urlCache.get(blob);
    if(!url){
      url = URL.createObjectURL(blob);
      urlCache.set(blob, url);
    }
    return url;
  }

  /* ---------------- storage (survives navigation, cleared on reload) ------------- */

  var dbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open("feedSession", 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains("state")) db.createObjectStore("state");
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });

  function withStore(mode, fn){
    return dbPromise.then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction("state", mode);
        var out = fn(tx.objectStore("state"));
        tx.oncomplete = function(){ resolve(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){ return null; });
  }

  function saveState(){
    return withStore("readwrite", function(store){ store.put(state, STATE_KEY); });
  }
  function loadState(){
    return withStore("readonly", function(store){ return store.get(STATE_KEY); });
  }
  function clearState(){
    return withStore("readwrite", function(store){ store.delete(STATE_KEY); });
  }

  function isReload(){
    try{
      var nav = performance.getEntriesByType("navigation")[0];
      if(nav && nav.type) return nav.type === "reload";
    }catch(e){}
    return false;
  }

  /* ---------------- image helpers ---------------- */

  function downscaleToBlob(file){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var MAXW = 1600;
        if(img.naturalWidth <= MAXW){
          URL.revokeObjectURL(url);
          resolve(file);
          return;
        }
        var scale = MAXW / img.naturalWidth;
        var canvas = document.createElement("canvas");
        canvas.width = MAXW;
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(b){ resolve(b || file); }, "image/webp", 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function toItem(file){
    if(file.type === "application/pdf"){
      return Promise.resolve({ blob: file, kind: "pdf", name: file.name, size: file.size });
    }
    return downscaleToBlob(file).then(function(blob){
      return { blob: blob, kind: "image", name: file.name, size: blob.size };
    });
  }

  function formatSize(bytes){
    if(bytes >= 1e6) return (bytes / 1e6).toFixed(1) + " MB";
    return Math.max(1, Math.round(bytes / 1e3)) + " KB";
  }

  function formatRefreshed(date){
    var weekday = date.toLocaleDateString("en-US", { weekday: "short" });
    var month = date.toLocaleDateString("en-US", { month: "short" });
    var hours = date.getHours();
    var ampm = hours >= 12 ? "pm" : "am";
    var h12 = hours % 12 || 12;
    var mm = date.getMinutes() < 10 ? "0" + date.getMinutes() : "" + date.getMinutes();
    return weekday + " " + date.getDate() + " " + month + " " + date.getFullYear() + " " + h12 + ":" + mm + ampm;
  }

  /* ---------------- node builders ---------------- */

  function frameNode(item){
    var art = document.createElement("article");
    art.className = "frame";
    var img = new Image();
    img.decoding = "async";
    img.alt = "Screenshot";
    img.src = objectUrl(item.blob);
    img.addEventListener("load", function(){
      art.style.aspectRatio = img.naturalWidth + "/" + img.naturalHeight;
    }, { once: true });
    art.appendChild(img);
    return art;
  }

  function pdfNode(item){
    var a = document.createElement("a");
    a.className = "doc-card";
    a.href = objectUrl(item.blob);
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<span class="doc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/></svg></span>' +
      '<span class="doc-text"><span class="doc-name"></span>' +
      '<span class="doc-meta">PDF · ' + formatSize(item.size) + '</span></span>';
    a.querySelector(".doc-name").textContent = item.name;
    return a;
  }

  function itemNode(item){
    return item.kind === "pdf" ? pdfNode(item) : frameNode(item);
  }

  function metaRow(){
    var row = document.createElement("div");
    row.className = "meta-row";
    row.innerHTML = "<strong>Last refreshed:</strong> " + formatRefreshed(new Date(state.stamp)) + " · build 17";
    return row;
  }

  function slotNode(tabIndex, slotIndex){
    var item = state.tabs[tabIndex][slotIndex];
    var slot = document.createElement("div");

    var input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.hidden = true;
    input.addEventListener("change", function(){
      var file = input.files && input.files[0];
      input.value = "";
      if(!file || file.type.indexOf("image/") !== 0) return;
      toItem(file).then(function(newItem){
        state.tabs[tabIndex][slotIndex] = newItem;
        saveState();
        renderPanel();
      });
    });

    if(item){
      slot.className = "slot filled";
      var img = new Image();
      img.decoding = "async";
      img.alt = "Photo";
      img.src = objectUrl(item.blob);
      img.addEventListener("load", function(){
        slot.style.aspectRatio = img.naturalWidth + "/" + img.naturalHeight;
      }, { once: true });
      slot.appendChild(img);
      var badge = document.createElement("span");
      badge.className = "slot-replace";
      badge.textContent = "Replace";
      slot.appendChild(badge);
    } else {
      slot.className = "slot";
      slot.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5.2-5.2a2 2 0 0 0-2.8 0L6 18"/></svg>' +
        "<span>Tap to add a photo</span>";
    }

    slot.appendChild(input);
    slot.addEventListener("click", function(e){
      e.stopPropagation();
      input.click();
    });
    return slot;
  }

  function startEditingLabel(btn, i){
    if(btn.querySelector(".tab-input")) return;

    btn.textContent = "";
    btn.classList.add("editing");

    var input = document.createElement("input");
    input.type = "text";
    input.className = "tab-input";
    input.value = state.labels[i];
    input.setAttribute("autocomplete", "off");
    input.setAttribute("autocapitalize", "words");
    input.setAttribute("spellcheck", "false");
    btn.appendChild(input);

    input.focus();
    try{ input.setSelectionRange(0, input.value.length); }catch(e){}

    var done = false;
    function finish(){
      if(done) return;
      done = true;
      var text = input.value.trim() || TAB_LABELS[i];
      state.labels[i] = text;
      btn.classList.remove("editing");
      btn.textContent = text;
      saveState();
      requestAnimationFrame(function(){ moveIndicator(true); });
    }

    input.addEventListener("blur", finish);
    input.addEventListener("keydown", function(e){
      e.stopPropagation();
      if(e.key === "Enter"){
        e.preventDefault();
        input.blur();
      }
    });
    input.addEventListener("click", function(e){ e.stopPropagation(); });
  }

  function renderPanel(){
    if(!panelEl) return;
    panelEl.innerHTML = "";
    for(var s = 0; s < SLOT_COUNTS[activeTab]; s++){
      panelEl.appendChild(slotNode(activeTab, s));
    }
  }

  function moveIndicator(animate){
    if(!indicatorEl || !tabBtnEls[activeTab]) return;
    var btn = tabBtnEls[activeTab];
    var toLeft = btn.offsetLeft;
    var toWidth = btn.offsetWidth;

    // instant placement (first paint, resize, label edits)
    if(!animate || reduceMotion || typeof indicatorEl.animate !== "function"){
      indicatorEl.getAnimations && indicatorEl.getAnimations().forEach(function(a){ a.cancel(); });
      indicatorPos = { left: toLeft, width: toWidth };
      indicatorEl.style.width = toWidth + "px";
      indicatorEl.style.transform = "translateX(" + toLeft + "px)";
      return;
    }

    var fromLeft = indicatorPos.left;
    var fromWidth = indicatorPos.width || toWidth;

    indicatorPos = { left: toLeft, width: toWidth };

    if(indicatorEl.getAnimations){
      indicatorEl.getAnimations().forEach(function(a){ a.cancel(); });
    }

    // travel straight toward the tapped tab — no mid-flight stretch
    indicatorEl.animate([
      { transform: "translateX(" + fromLeft + "px)", width: fromWidth + "px" },
      { transform: "translateX(" + toLeft + "px)", width: toWidth + "px" }
    ], {
      duration: 380,
      easing: "cubic-bezier(.32,.72,0,1)",
      fill: "forwards"
    });

    indicatorEl.style.width = toWidth + "px";
    indicatorEl.style.transform = "translateX(" + toLeft + "px)";
  }

  function setActiveTab(i){
    if(i === activeTab) return;
    activeTab = i;
    tabBtnEls.forEach(function(b, j){
      b.classList.toggle("active", j === activeTab);
    });
    moveIndicator(true);
    renderPanel();
  }

  function tabsSection(){
    var wrap = document.createElement("div");
    wrap.className = "tabs-wrap";

    var bar = document.createElement("div");
    bar.className = "tab-bar";

    indicatorEl = document.createElement("div");
    indicatorEl.className = "tab-indicator";
    bar.appendChild(indicatorEl);

    tabBtnEls = state.labels.map(function(label, i){
      var btn = document.createElement("div");
      btn.className = "tab-btn" + (i === activeTab ? " active" : "");
      btn.textContent = label;
      btn.setAttribute("role", "tab");
      var lastTap = 0;
      var tapTimer = null;
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        if(btn.classList.contains("editing")) return;

        var now = Date.now();
        if(now - lastTap < 400){
          // second tap: edit the label
          lastTap = 0;
          if(tapTimer){ clearTimeout(tapTimer); tapTimer = null; }
          startEditingLabel(btn, i);
          return;
        }
        lastTap = now;
        setActiveTab(i);
      });
      bar.appendChild(btn);
      return btn;
    });
    wrap.appendChild(bar);

    panelEl = document.createElement("div");
    panelEl.className = "tab-panel";
    wrap.appendChild(panelEl);
    renderPanel();

    // place the pill once the bar has been laid out
    requestAnimationFrame(function(){ moveIndicator(false); });

    return wrap;
  }

  /* ---------------- render ---------------- */

  function render(){
    reel.innerHTML = "";
    panelEl = null;
    indicatorEl = null;
    tabBtnEls = [];

    if(!state.feed.length){
      reel.innerHTML =
        '<div class="empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5.2-5.2a2 2 0 0 0-2.8 0L6 18"/></svg>' +
          '<div class="empty-title">Opening picker…</div>' +
          '<div class="empty-sub">If nothing opens, tap anywhere to choose screenshots or PDFs.<br>build 17</div>' +
        '</div>';
      return;
    }

    reel.appendChild(metaRow());
    reel.appendChild(itemNode(state.feed[0]));
    reel.appendChild(tabsSection());
  }

  /* ---------------- picking ---------------- */

  // Only one item sits above the tabs on this page.
  function addFiles(fileList){
    var files = Array.prototype.slice.call(fileList).filter(function(f){
      return f.type.indexOf("image/") === 0 || f.type === "application/pdf";
    });
    if(!files.length) return;
    toItem(files[0]).then(function(item){
      state.feed = [item];
      if(!state.stamp) state.stamp = Date.now();
      saveState();
      render();
    });
  }

  fileInput.addEventListener("change", function(){
    if(fileInput.files && fileInput.files.length) addFiles(fileInput.files);
    fileInput.value = "";
  });

  function openPicker(){
    if(state.feed.length) return;
    fileInput.click();
  }

  document.addEventListener("click", openPicker);

  window.addEventListener("resize", function(){ moveIndicator(false); });

  /* ---------------- page transition ---------------- */

  var SLIDE_MS = 380;
  var SLIDE_EASE = "cubic-bezier(.32,.72,0,1)";

  // If the browser drives the transition natively, JS must not animate too.
  var nativeVT = typeof CSS !== "undefined" && CSS.supports &&
                 CSS.supports("view-transition-name", "none");

  // Fallback only: arriving page slides in from the left.
  if(sessionStorage.getItem("navSlide")){
    sessionStorage.removeItem("navSlide");
    if(!nativeVT && !reduceMotion && typeof stage.animate === "function"){
      stage.classList.add("sliding");
      var enter = stage.animate([
        { transform: "translateX(-100%)" },
        { transform: "translateX(0)" }
      ], { duration: SLIDE_MS, easing: SLIDE_EASE });
      enter.onfinish = function(){ stage.classList.remove("sliding"); };
    }
  }

  function slideNavigate(url){
    if(nativeVT || reduceMotion || typeof stage.animate !== "function"){
      window.location.href = url;
      return;
    }

    var navigated = false;
    function go(){
      if(navigated) return;
      navigated = true;
      window.location.href = url;
    }

    sessionStorage.setItem("navSlide", "1");

    stage.classList.add("sliding");
    var exit = stage.animate([
      { transform: "translateX(0)" },
      { transform: "translateX(100%)" }
    ], { duration: SLIDE_MS, easing: SLIDE_EASE, fill: "forwards" });

    exit.onfinish = go;
    setTimeout(go, SLIDE_MS + 160);
  }

  backBtn.addEventListener("click", function(e){
    e.stopPropagation();
    slideNavigate("upload.html");
  });

  /* ---------------- boot ---------------- */

  if(isReload()){
    clearState().then(function(){ render(); openPicker(); });
  } else {
    loadState().then(function(saved){
      if(saved && saved.feed && saved.feed.length){
        state = saved;
        if(!state.tabs) state.tabs = SLOT_COUNTS.map(function(n){ return new Array(n).fill(null); });
        if(!state.labels) state.labels = TAB_LABELS.slice();
        // drop any extras saved before the one-photo rule
        if(state.feed.length > 1){
          state.feed = state.feed.slice(0, 1);
          saveState();
        }
        render();
      } else {
        render();
        openPicker();
      }
    });
  }
})();
</script>
</body>
</html>
