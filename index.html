<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Screenshot Feed</title>
<meta name="description" content="A clean vertical scrolling feed of screenshots and PDFs you pick once per visit, sized for iPhone 17 Pro Max.">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screenshots">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">

<style>
  :root{
    --bg: #FFFFFF;
    --ink: #111111;
    --ink-dim: #9A9A9A;
    --line: rgba(17,17,17,0.10);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ margin:0; padding:0; overflow-x:hidden; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    display:flex;
    justify-content:center;
    min-height: 100dvh;
  }

  .stage{
    width: 100%;
    min-height: 100dvh;
    background: var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media (min-width: 600px){
    .stage{ max-width: 430px; margin: 20px 0; min-height: calc(100dvh - 40px); border-radius: 46px; overflow:hidden; box-shadow: 0 24px 60px -30px rgba(0,0,0,0.35); }
    .topbar{ max-width: 430px; margin: 0 auto; }
  }

  /* ---------- bubble page transition ---------- */
  .nav-bubble{
    position: fixed;
    z-index: 90;
    background: var(--bg);
    pointer-events: none;
    will-change: width, height, top, left, border-radius, opacity;
    box-shadow: 0 10px 40px -12px rgba(17,17,17,0.25);
  }

  /* ---------- floating header ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0));
    backdrop-filter: blur(2.5px) saturate(160%);
    -webkit-backdrop-filter: blur(2.5px) saturate(160%);
    -webkit-mask-image: linear-gradient(180deg, #000 75%, transparent);
    mask-image: linear-gradient(180deg, #000 75%, transparent);
    pointer-events: none;
  }
  .topbar-back{
    position:absolute; left:16px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    width:40px; height:40px; border-radius:50%;
    background: linear-gradient(155deg, rgba(255,255,255,0.4), rgba(255,255,255,0.06) 60%, rgba(255,255,255,0.14));
    backdrop-filter: blur(2px) saturate(160%);
    -webkit-backdrop-filter: blur(2px) saturate(160%);
    color: var(--ink);
    box-shadow: 0 8px 18px -8px rgba(17,17,17,0.18), inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -6px 10px -8px rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; pointer-events:auto;
  }
  .topbar-back svg{ width:18px; height:18px; }
  .topbar-title{
    font-size:19px; font-weight:700; color: rgba(17,17,17,0.8);
  }

  .meta-row{
    padding: 14px 16px 0;
    margin-bottom: -4px;
    font-size: 12px; color: var(--ink-dim);
    text-align: center;
  }
  .meta-row strong{ color: rgba(17,17,17,0.75); font-weight:500; }

  .reel{
    flex:1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    scroll-behavior: smooth;
    scroll-snap-type: y proximity;
    padding: calc(env(safe-area-inset-top, 0px) + 62px) 0 0;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  .frame{
    scroll-snap-align: start;
    overflow:hidden;
    background: var(--bg);
    opacity:0; transform: translateY(8px);
    animation: rise .45s cubic-bezier(.2,.7,.3,1) forwards;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce){
    .frame{ animation: none; opacity:1; transform:none; }
    .stage{ transition:none; }
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .frame img{
    width:100%; height:100%; object-fit: cover; display:block;
  }

  /* ---------- pdf card ---------- */
  .doc-card{
    display:flex; align-items:center; gap:12px;
    margin: 0 14px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    text-decoration:none;
    color: var(--ink);
    pointer-events: auto;
  }
  .doc-icon{
    flex-shrink:0;
    width:38px; height:38px;
    border-radius:9px;
    background: #F4F4F2;
    display:flex; align-items:center; justify-content:center;
  }
  .doc-icon svg{ width:18px; height:18px; color: var(--ink-dim); }
  .doc-text{ min-width:0; }
  .doc-name{
    font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .doc-meta{ font-size:12px; color: var(--ink-dim); margin-top:1px; }

  /* ---------- tabs ---------- */
  .tabs-wrap{ display:flex; flex-direction:column; }
  .tab-bar{
    display:flex; gap:2px;
    margin: 16px 14px 12px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
  }
  .tab-btn{
    flex:1; border:none; background:transparent; cursor:pointer;
    padding: 9px 4px; border-radius: 999px;
    font-size: 14px; font-weight:600; color: var(--ink-dim);
    transition: background .18s ease, color .18s ease;
  }
  .tab-btn.active{ background: var(--ink); color: #fff; }
  .tab-panel{ display:flex; flex-direction:column; gap:10px; }
  .slot{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    min-height: 130px; padding: 30px 20px; margin: 0 14px;
    border: 1px dashed var(--line); border-radius: 14px;
    color: var(--ink-dim); font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .slot svg{ width:24px; height:24px; }
  .slot.filled{
    display:block;
    min-height:0; padding:0; margin:0;
    border:none; border-radius:0;
    overflow:hidden;
  }
  .slot.filled img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .slot-replace{
    position:absolute; right:12px; bottom:12px;
    background: rgba(17,17,17,0.5); color:#fff;
    font-size:11.5px; font-weight:600;
    padding:6px 11px; border-radius:999px;
    display:none;
  }
  .slot.filled .slot-replace{ display:block; }

  /* ---------- empty state ---------- */
  .empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 14px; padding: 40px 30px; text-align:center; color: var(--ink-dim);
  }
  .empty svg{ width:30px; height:30px; color: var(--ink-dim); }
  .empty-title{ font-size:15px; font-weight:600; color: var(--ink); }
  .empty-sub{ font-size: 13px; max-width: 220px; line-height:1.5; }
</style>
</head>
<body>

<div class="stage">
  <header class="topbar">
    <button class="topbar-back" id="backBtn" type="button" aria-label="Add photos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l-8 8 8 8"/></svg>
    </button>
    <span class="topbar-title">View details</span>
  </header>
  <main class="reel" id="reel">
    <div class="empty" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5.2-5.2a2 2 0 0 0-2.8 0L6 18"/></svg>
      <div class="empty-title">Opening picker…</div>
      <div class="empty-sub">If nothing opens, tap anywhere to choose screenshots or PDFs.</div>
    </div>
  </main>
  <input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden>
</div>

<script>
(function(){
  "use strict";

  var reel = document.getElementById("reel");
  var fileInput = document.getElementById("fileInput");
  var backBtn = document.getElementById("backBtn");
  var stage = document.querySelector(".stage");
  var filesChosen = false;

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Arriving from a bubble transition: cross-fade the content in.
  if(sessionStorage.getItem("navBubble")){
    sessionStorage.removeItem("navBubble");
    if(!reduceMotion){
      stage.style.opacity = "0";
      requestAnimationFrame(function(){
        stage.style.transition = "opacity .18s ease-out";
        stage.style.opacity = "1";
        setTimeout(function(){
          stage.style.transition = "";
          stage.style.opacity = "";
        }, 320);
      });
    }
  }

  function bubbleNavigate(el, url){
    if(reduceMotion || typeof el.animate !== "function"){
      window.location.href = url;
      return;
    }
    var rect = el.getBoundingClientRect();
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var bubble = document.createElement("div");
    bubble.className = "nav-bubble";
    document.body.appendChild(bubble);

    var navigated = false;
    function go(){
      if(navigated) return;
      navigated = true;
      window.location.href = url;
    }

    sessionStorage.setItem("navBubble", "1");

    var anim = bubble.animate([
      { left: rect.left + "px", top: rect.top + "px",
        width: rect.width + "px", height: rect.height + "px",
        borderRadius: "50%", opacity: 0.55 },
      { left: "0px", top: "0px",
        width: vw + "px", height: vh + "px",
        borderRadius: "0px", opacity: 1 }
    ], {
      duration: 460,
      easing: "cubic-bezier(.22,.61,.36,1)",
      fill: "forwards"
    });

    anim.onfinish = go;
    setTimeout(go, 620);
  }

  backBtn.addEventListener("click", function(e){
    e.stopPropagation();
    bubbleNavigate(backBtn, "upload.html");
  });

  function frameNode(file, url){
    var art = document.createElement("article");
    art.className = "frame";
    var img = new Image();
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = "Screenshot";
    img.src = url;
    img.addEventListener("load", function(){
      art.style.aspectRatio = img.naturalWidth + "/" + img.naturalHeight;
    }, { once: true });
    art.appendChild(img);
    return art;
  }

  function downscaleIfNeeded(file){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var MAXW = 1600;
        if(img.naturalWidth <= MAXW){
          resolve(url);
          return;
        }
        var scale = MAXW / img.naturalWidth;
        var canvas = document.createElement("canvas");
        canvas.width = MAXW;
        canvas.height = Math.round(img.naturalHeight * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(b){
          resolve(b ? URL.createObjectURL(b) : url);
        }, "image/webp", 0.85);
      };
      img.onerror = function(){ resolve(url); };
      img.src = url;
    });
  }

  function formatSize(bytes){
    if(bytes >= 1e6) return (bytes / 1e6).toFixed(1) + " MB";
    return Math.max(1, Math.round(bytes / 1e3)) + " KB";
  }

  function pdfNode(file, url){
    var a = document.createElement("a");
    a.className = "doc-card";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<span class="doc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/></svg></span>' +
      '<span class="doc-text">' +
        '<span class="doc-name"></span>' +
        '<span class="doc-meta">PDF · ' + formatSize(file.size) + '</span>' +
      '</span>';
    a.querySelector(".doc-name").textContent = file.name;
    return a;
  }

  function formatRefreshed(date){
    var weekday = date.toLocaleDateString("en-US", { weekday: "short" });
    var day = date.getDate();
    var month = date.toLocaleDateString("en-US", { month: "short" });
    var year = date.getFullYear();
    var hours = date.getHours();
    var minutes = date.getMinutes();
    var ampm = hours >= 12 ? "pm" : "am";
    var h12 = hours % 12 || 12;
    var mm = minutes < 10 ? "0" + minutes : "" + minutes;
    return weekday + " " + day + " " + month + " " + year + " " + h12 + ":" + mm + ampm;
  }

  function metaRow(){
    var row = document.createElement("div");
    row.className = "meta-row";
    row.innerHTML = "<strong>Last refreshed:</strong> " + formatRefreshed(new Date());
    return row;
  }

  function buildTabsSection(){
    var wrap = document.createElement("div");
    wrap.className = "tabs-wrap";

    var bar = document.createElement("div");
    bar.className = "tab-bar";
    var labels = ["Tab 1", "Tab 2", "Tab 3"];
    var tabBtns = labels.map(function(label, i){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn" + (i === 0 ? " active" : "");
      btn.textContent = label;
      bar.appendChild(btn);
      return btn;
    });
    wrap.appendChild(bar);

    var slotCounts = [3, 1, 1];

    var panels = labels.map(function(_, i){
      var panel = document.createElement("div");
      panel.className = "tab-panel";
      panel.hidden = i !== 0;
      for(var s = 0; s < slotCounts[i]; s++){
        panel.appendChild(makeSlot());
      }
      wrap.appendChild(panel);
      return panel;
    });

    tabBtns.forEach(function(btn, i){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        tabBtns.forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        panels.forEach(function(p, j){ p.hidden = j !== i; });
      });
    });

    function makeSlot(){
      var slot = document.createElement("div");
      slot.className = "slot";
      slot.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5.2-5.2a2 2 0 0 0-2.8 0L6 18"/></svg>' +
        "<span>Tap to add a photo</span>";

      var input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.hidden = true;
      slot.appendChild(input);

      input.addEventListener("change", function(){
        var file = input.files && input.files[0];
        input.value = "";
        if(!file || file.type.indexOf("image/") !== 0) return;
        downscaleIfNeeded(file).then(function(url){
          var img = new Image();
          img.decoding = "async";
          img.alt = "Photo";
          img.src = url;
          img.addEventListener("load", function(){
            slot.style.aspectRatio = img.naturalWidth + "/" + img.naturalHeight;
          }, { once: true });

          slot.innerHTML = "";
          slot.className = "slot filled";
          slot.appendChild(img);
          var badge = document.createElement("span");
          badge.className = "slot-replace";
          badge.textContent = "Replace";
          slot.appendChild(badge);
          slot.appendChild(input);
        });
      });

      slot.addEventListener("click", function(e){
        e.stopPropagation();
        input.click();
      });

      return slot;
    }

    return wrap;
  }

  function showFiles(fileList){
    var files = Array.prototype.slice.call(fileList).filter(function(f){
      return f.type.indexOf("image/") === 0 || f.type === "application/pdf";
    });
    if(!files.length) return;
    reel.innerHTML = "";
    reel.appendChild(metaRow());

    function appendFirst(node){
      reel.appendChild(node);
      reel.appendChild(buildTabsSection());
    }

    files.forEach(function(file, idx){
      if(file.type === "application/pdf"){
        var node = pdfNode(file, URL.createObjectURL(file));
        if(idx === 0){ appendFirst(node); } else { reel.appendChild(node); }
        return;
      }
      downscaleIfNeeded(file).then(function(url){
        var node = frameNode(file, url);
        if(idx === 0){ appendFirst(node); } else { reel.appendChild(node); }
      });
    });
  }

  function openPicker(){
    if(filesChosen) return;
    fileInput.click();
  }

  fileInput.addEventListener("change", function(){
    if(fileInput.files && fileInput.files.length){
      filesChosen = true;
      showFiles(fileInput.files);
    }
  });

  window.addEventListener("load", openPicker);
  document.addEventListener("click", openPicker);
})();
</script>
</body>
</html>
